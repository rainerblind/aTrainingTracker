<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <!-- Outer Card Background -->
  <rect width="900" height="540" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">
    Höchstmaß 5-Layer Swiss Cheese Defense Model
  </text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#475569">
    Staggered, uncorrelated review barriers ensure defects are caught before production: P(escape) = p₁ · p₂ · p₃ · p₄ · p₅
  </text>

  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ==================== LEFT COLUMN: STAGGERED BARRIER PLATES (x=24..374) ==================== -->
  <!-- Incoming Hazard Header Box -->
  <rect x="24" y="68" width="350" height="28" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="199" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">
    ↓ Incoming Bugs, Hallucinations &amp; Regressions ↓
  </text>

  <!-- Vertical Trajectory Arena -->
  <rect x="24" y="102" width="350" height="384" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Subtle vertical guide lanes at x=95, x=165, x=235, x=305 -->
  <g stroke="#f1f5f9" stroke-width="16">
    <line x1="95"  y1="104" x2="95"  y2="452"/>
    <line x1="165" y1="104" x2="165" y2="452"/>
    <line x1="235" y1="104" x2="235" y2="452"/>
    <line x1="305" y1="104" x2="305" y2="452"/>
  </g>

  <!-- ===== BARRIER L1 (y=124..150) : Openings at x=151..179, x=221..249, x=291..319 ===== -->
  <g fill="#93c5fd" stroke="#2563eb" stroke-width="1.5">
    <rect x="34"  y="124" width="117" height="26" rx="4"/>
    <rect x="179" y="124" width="42"  height="26" rx="4"/>
    <rect x="249" y="124" width="42"  height="26" rx="4"/>
    <rect x="319" y="124" width="45"  height="26" rx="4"/>
  </g>
  <text x="44" y="141" font-size="11" font-weight="bold" fill="#1e3a8a">L1</text>

  <!-- ===== BARRIER L2 (y=198..224) : Openings at x=81..109, x=221..249, x=291..319 ===== -->
  <g fill="#a5b4fc" stroke="#4f46e5" stroke-width="1.5">
    <rect x="34"  y="198" width="47"  height="26" rx="4"/>
    <rect x="109" y="198" width="112" height="26" rx="4"/>
    <rect x="249" y="198" width="42"  height="26" rx="4"/>
    <rect x="319" y="198" width="45"  height="26" rx="4"/>
  </g>
  <text x="44" y="215" font-size="11" font-weight="bold" fill="#312e81">L2</text>

  <!-- ===== BARRIER L3 (y=272..298) : Openings at x=151..179, x=291..319 ===== -->
  <g fill="#d8b4fe" stroke="#9333ea" stroke-width="1.5">
    <rect x="34"  y="272" width="117" height="26" rx="4"/>
    <rect x="179" y="272" width="112" height="26" rx="4"/>
    <rect x="319" y="272" width="45"  height="26" rx="4"/>
  </g>
  <text x="44" y="289" font-size="11" font-weight="bold" fill="#581c87">L3</text>

  <!-- ===== BARRIER L4 (y=346..372) : Opening at x=81..109 ===== -->
  <g fill="#fcd34d" stroke="#d97706" stroke-width="1.5">
    <rect x="34"  y="346" width="47"  height="26" rx="4"/>
    <rect x="109" y="346" width="255" height="26" rx="4"/>
  </g>
  <text x="44" y="363" font-size="11" font-weight="bold" fill="#78350f">L4</text>

  <!-- ===== BARRIER L5 (y=420..446) : Opening at x=221..249 ===== -->
  <g fill="#86efac" stroke="#16a34a" stroke-width="1.5">
    <rect x="34"  y="420" width="187" height="26" rx="4"/>
    <rect x="249" y="420" width="115" height="26" rx="4"/>
  </g>
  <text x="44" y="437" font-size="11" font-weight="bold" fill="#14532d">L5</text>

  <!-- ==================== 4 STRAIGHT VERTICAL DEFECT RAYS ==================== -->
  <!-- Ray 1 (x=95): Caught immediately at L1 -->
  <line x1="95" y1="98" x2="95" y2="119" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="4,2" marker-end="url(#arrowRed)"/>
  <circle cx="95" cy="124" r="7" fill="#dc2626"/>
  <text x="95" y="128" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">✕</text>

  <!-- Ray 2 (x=165): Slips through L1 hole, caught at L2 -->
  <line x1="165" y1="98" x2="165" y2="193" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="4,2" marker-end="url(#arrowRed)"/>
  <circle cx="165" cy="198" r="7" fill="#dc2626"/>
  <text x="165" y="202" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">✕</text>

  <!-- Ray 3 (x=235): Slips through L1 & L2 holes, caught at L3 -->
  <line x1="235" y1="98" x2="235" y2="267" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="4,2" marker-end="url(#arrowRed)"/>
  <circle cx="235" cy="272" r="7" fill="#dc2626"/>
  <text x="235" y="276" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">✕</text>

  <!-- Ray 4 (x=305): Slips through L1, L2 & L3 holes, caught at L4 (Human Review) -->
  <line x1="305" y1="98" x2="305" y2="341" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="4,2" marker-end="url(#arrowRed)"/>
  <circle cx="305" cy="346" r="7" fill="#dc2626"/>
  <text x="305" y="350" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">✕</text>

  <!-- Legend inside Left Column bottom -->
  <text x="199" y="472" text-anchor="middle" font-size="10.5" fill="#475569">
    ✕ = Defect blocked by barrier  •  Openings = Uncorrelated blind spots
  </text>

  <!-- Bottom Result Banner -->
  <rect x="24" y="494" width="350" height="28" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="199" y="512" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">
    ✓ Production Release (No Aligned Holes Across L1–L5)
  </text>

  <!-- ==================== RIGHT COLUMN: CLEAN LAYER DESCRIPTIONS (x=392..876) ==================== -->
  <!-- Card 1 -->
  <g transform="translate(392, 110)">
    <rect width="484" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="16" y="22" font-size="12.5" font-weight="bold" fill="#1e3a8a">Layer 1 (p₁): Executing Agent (Sub-Task Level)</text>
    <text x="16" y="41" font-size="11" fill="#1e40af">Bounded stage context + compiler, unit tests &amp; static linters</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(392, 184)">
    <rect width="484" height="54" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="16" y="22" font-size="12.5" font-weight="bold" fill="#312e81">Layer 2 (p₂): Reviewing Agent (Sub-Task Gate — Pro ↔ Flash)</text>
    <text x="16" y="41" font-size="11" fill="#3730a3">Uncorrelated model tier audits every stage deliverable (Gates 1–5)</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(392, 258)">
    <rect width="484" height="54" rx="8" fill="#fae8ff" stroke="#a855f7" stroke-width="1.5"/>
    <text x="16" y="22" font-size="12.5" font-weight="bold" fill="#581c87">Layer 3 (p₃): Holistic Ticket Verification (Stage 5)</text>
    <text x="16" y="41" font-size="11" fill="#6b21a8">Clean-room full regression suite, walkthrough &amp; requirement parity</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(392, 332)">
    <rect width="484" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="16" y="22" font-size="12.5" font-weight="bold" fill="#78350f">Layer 4 (p₄): The Human Engineer (Final Review Gate)</text>
    <text x="16" y="41" font-size="11" fill="#92400e">Hands-on device testing, domain judgment &amp; exclusive sign-off</text>
  </g>

  <!-- Card 5 -->
  <g transform="translate(392, 406)">
    <rect width="484" height="54" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="16" y="22" font-size="12.5" font-weight="bold" fill="#14532d">Layer 5 (p₅): Periodic Cross-Vendor Audits (Claude &amp; ChatGPT)</text>
    <text x="16" y="41" font-size="11" fill="#166534">Independent codebase reviews (Claude) &amp; cold-eye UI critiques (ChatGPT)</text>
  </g>
</svg>
