<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <!-- Background -->
  <rect width="820" height="500" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">
    Höchstmaß 5-Layer Swiss Cheese Defense Model
  </text>
  <text x="410" y="54" text-anchor="middle" font-size="12" fill="#475569">
    Uncorrelated review layers ensure P(escaped defect) = p₁ · p₂ · p₃ · p₄ · p₅
  </text>

  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Incoming Hazard label -->
  <rect x="20" y="72" width="600" height="28" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="320" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">
    Potential Defect / Hallucination / Regression Hazard
  </text>

  <!-- ==================== LAYER 1 ==================== -->
  <g transform="translate(20, 118)">
    <rect width="600" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <!-- Swiss cheese holes -->
    <circle cx="95" cy="27" r="11" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="260" cy="27" r="11" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="470" cy="27" r="11" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="30" y="23" font-size="13" font-weight="bold" fill="#1e3a8a">Layer 1: Executing Agent (Sub-Task Level)</text>
    <text x="30" y="42" font-size="11" fill="#1e40af">Bounded stage context + local compiler, unit tests &amp; static linters</text>
  </g>
  <text x="640" y="142" font-size="12" font-weight="bold" fill="#1e3a8a">p₁ (Authoring &amp; Build)</text>
  <text x="640" y="158" font-size="11" fill="#475569">Catches syntax &amp; unit errors</text>

  <!-- ==================== LAYER 2 ==================== -->
  <g transform="translate(20, 188)">
    <rect width="600" height="54" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <!-- Swiss cheese holes (offset from Layer 1!) -->
    <circle cx="165" cy="27" r="11" fill="#f8fafc" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="350" cy="27" r="11" fill="#f8fafc" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="535" cy="27" r="11" fill="#f8fafc" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="30" y="23" font-size="13" font-weight="bold" fill="#312e81">Layer 2: Reviewing Agent (Sub-Task Gate — Pro ↔ Flash)</text>
    <text x="30" y="42" font-size="11" fill="#3730a3">Asymmetric model tier audits every stage deliverable (Gates 1–5)</text>
  </g>
  <text x="640" y="212" font-size="12" font-weight="bold" fill="#312e81">p₂ (Sub-Task Gate)</text>
  <text x="640" y="228" font-size="11" fill="#475569">Uncorrelated model tier</text>

  <!-- ==================== LAYER 3 ==================== -->
  <g transform="translate(20, 258)">
    <rect width="600" height="54" rx="8" fill="#fae8ff" stroke="#a855f7" stroke-width="2"/>
    <!-- Swiss cheese holes (offset again!) -->
    <circle cx="125" cy="27" r="11" fill="#f8fafc" stroke="#d8b4fe" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="410" cy="27" r="11" fill="#f8fafc" stroke="#d8b4fe" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="30" y="23" font-size="13" font-weight="bold" fill="#581c87">Layer 3: Ticket-Wide Verification Session (Stage 5)</text>
    <text x="30" y="42" font-size="11" fill="#6b21a8">Clean-room full regression suite, walkthrough &amp; requirement parity check</text>
  </g>
  <text x="640" y="282" font-size="12" font-weight="bold" fill="#581c87">p₃ (Whole-Ticket Check)</text>
  <text x="640" y="298" font-size="11" fill="#475569">End-to-end integration audit</text>

  <!-- ==================== LAYER 4 ==================== -->
  <g transform="translate(20, 328)">
    <rect width="600" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <!-- Swiss cheese hole -->
    <circle cx="295" cy="27" r="11" fill="#f8fafc" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="30" y="23" font-size="13" font-weight="bold" fill="#78350f">Layer 4: The Human Engineer (Final Review Gate)</text>
    <text x="30" y="42" font-size="11" fill="#92400e">Hands-on device testing, domain judgment &amp; exclusive ticket sign-off</text>
  </g>
  <text x="640" y="352" font-size="12" font-weight="bold" fill="#78350f">p₄ (Human Governance)</text>
  <text x="640" y="368" font-size="11" fill="#475569">Real-world UX &amp; domain sign-off</text>

  <!-- ==================== LAYER 5 ==================== -->
  <g transform="translate(20, 398)">
    <rect width="600" height="54" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <!-- Swiss cheese hole -->
    <circle cx="495" cy="27" r="11" fill="#f8fafc" stroke="#86efac" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="30" y="23" font-size="13" font-weight="bold" fill="#14532d">Layer 5: Periodic Cross-Vendor Audits (Claude &amp; ChatGPT)</text>
    <text x="30" y="42" font-size="11" fill="#166534">Independent codebase reviews by Claude &amp; UI screenshot critiques by ChatGPT</text>
  </g>
  <text x="640" y="422" font-size="12" font-weight="bold" fill="#14532d">p₅ (Cross-Vendor Audit)</text>
  <text x="640" y="438" font-size="11" fill="#475569">Breaks vendor-level blind spots</text>

  <!-- Defect ray 1: blocked at Layer 2 -->
  <line x1="115" y1="100" x2="115" y2="188" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>
  <circle cx="115" cy="188" r="4" fill="#dc2626"/>

  <!-- Defect ray 2: passes hole in L1 (280), blocked at Layer 2 -->
  <line x1="280" y1="100" x2="280" y2="188" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>
  <circle cx="280" cy="188" r="4" fill="#dc2626"/>

  <!-- Defect ray 3: blocked at Layer 3 -->
  <line x1="490" y1="100" x2="490" y2="258" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>
  <circle cx="490" cy="258" r="4" fill="#dc2626"/>

  <!-- Bottom Result Banner -->
  <rect x="20" y="462" width="600" height="26" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="320" y="479" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">
    ✓ Production Release (All 5 Uncorrelated Defense Layers Passed)
  </text>
</svg>
