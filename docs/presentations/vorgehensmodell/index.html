  <style>
    
    :root {
      --background: #0f172a; --card: #1e293b; --foreground: #f8fafc;
      --muted-foreground: #94a3b8; --border: #334155;
      --primary: #0d9488; --primary-foreground: #ffffff;
      --secondary: #334155; --secondary-foreground: #f1f5f9;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --background: #f1f5f9; --card: #ffffff; --foreground: #0f172a;
        --muted-foreground: #475569; --border: #cbd5e1;
        --primary: #0d9488; --primary-foreground: #ffffff;
        --secondary: #e2e8f0; --secondary-foreground: #0f172a;
      }
    }

    * { box-sizing: border-box; }
    .shell { max-width: 1520px; margin: 0 auto; padding: 14px 18px 24px; }
    .topbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .topbar h1 { margin: 0; font-size: 17px; font-weight: 800; color: var(--foreground); }
    .topbar p { margin: 2px 0 0; font-size: 13px; color: var(--muted-foreground); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .btn {
      padding: 7px 12px; border-radius: 9px; font-size: 12.5px; font-weight: 600; cursor: pointer;
      border: 1px solid var(--border); background: var(--secondary); color: var(--secondary-foreground);
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
    .nav-strip {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px;
      padding: 10px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--border);
      align-items: center;
    }
    .sep { font-size: 12px; font-weight: 700; color: var(--muted-foreground); padding: 0 6px; }
    .tab {
      padding: 6px 11px; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer;
      border: 1px solid var(--border); background: var(--background); color: var(--foreground);
    }
    .tab.active { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
    .stage {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px;
    }
    .slide-frame {
      border-radius: 10px; overflow: hidden; border: 1px solid #CBD5E1; background: #F8FAFC;
    }
    .slide-panel svg { display: block; width: 100%; height: auto; }
    .speaker-bar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
      margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
    }
    .note { font-size: 13.5px; color: var(--muted-foreground); flex: 1; min-width: 260px; }
    .note strong { color: var(--foreground); }
    .pager { display: flex; align-items: center; gap: 8px; }
    .counter { font-size: 13px; font-weight: 700; color: var(--foreground); min-width: 58px; text-align: center; }
  </style>
</head>

    const SLIDES = [{"id": "01_evolution_ueberblick", "group": "A", "short": "01 · Überblick", "title": "Unsere Reise in 5 Stufen (Juni – Nov. 2026)", "note": "Einstiegsfolie: Zeigt den gesamten Entwicklungsbogen in 5 Monaten und wie aus 80 Anforderungen 1.265 verifizierte Anforderungen wurden."}, {"id": "02_stufe1_vibe_coding", "group": "A", "short": "02 · Vibe-Coding", "title": "Stufe 1: Vibe-Coding — Einfach mal drauflos", "note": "Startpunkt ohne Prozess: Superschnell für Wegwerf-Prototypen, aber riskant für gewachsene Apps wegen stiller Regressionen und fehlendem Gedächtnis."}, {"id": "03_stufe2_augenmass", "group": "A", "short": "03 · Augenmaß", "title": "Stufe 2: Augenmaß — Mensch + Zweitmeinung", "note": "Der erste große Qualitätssprung: Ein zweiter, unabhängiger Agent kritisiert den ersten — aber ohne schriftliche Anforderungen bleibt es Bauchgefühl."}, {"id": "04_stufe3_sorgfaeltig", "group": "A", "short": "04 · Sorgfältig", "title": "Stufe 3: Sorgfältig — Ticket für Ticket getestet", "note": "Juni–August 2026: Mit Jira-Tickets, erster requirements.md und Tests entsteht sauberes Handwerk — aber der Mensch ist der zeitliche Flaschenhals."}, {"id": "05_stufe4a_hoechstmass", "group": "A", "short": "05 · Höchstmaß (4a)", "title": "Stufe 4a: Höchstmaß — Bewusste Stolpersteine & Gates", "note": "September 2026: Geburt von Agile Agentic ASPICE (AAA) mit 5 festen Stufen, Gate-3 Code-Stopp und Vier-Augen-Prinzip — 3× mehr Durchsatz."}, {"id": "06_stufe4b_skalierung", "group": "A", "short": "06 · Härtung (4b)", "title": "Stufe 4b: Höchstmaß gehärtet — Parallelität & Kalt-Review", "note": "Oktober–Mitte Nov. 2026: 9 Kernregeln statt 84+, parallele Arbeitskopien, eigener Android-Emulator und kalte End-Prüfung ohne Vorwissen."}, {"id": "07_stufe5_schichtbetrieb", "group": "A", "short": "07 · Schichtbetrieb", "title": "Stufe 5: Schichtbetrieb nach Höchstmaß (AKTIV)", "note": "Seit Mitte Nov. 2026: Nahtloser 24/7-Takt auf 3 Spuren, Live-Emulator-Prüfung, smarte Modellwahl (Flash vs. Pro/Neon) und ehrliche Abwägung der Trade-offs."}, {"id": "08_heute_takt_und_rollen", "group": "B", "short": "08 · Takt & Rollen", "title": "Heute im Betrieb: 3 Schichten & klare Rollen", "note": "Zeigt einfach und klar die 3 Schichten (05/15/22 Uhr) und die Aufgabenteilung zwischen Mensch (PO), Schichtführer und KI-Teams."}, {"id": "09_heute_weg_eines_tickets", "group": "B", "short": "09 · Weg des Tickets", "title": "Der Weg eines Tickets: 6 Stufen bis zum Menschen", "note": "Visualisiert die 6 klaren Schritte von der Analyse über den Code-Stopp bis zum kalten Live-Check inkl. automatischer Nachbesserungs-Schleife."}, {"id": "10_heute_sicherheitsnetz", "group": "B", "short": "10 · Sicherheitsnetz", "title": "Unser 5-faches Sicherheitsnetz (Swiss Cheese)", "note": "Erklärt das Swiss-Cheese-Prinzip mit 5 unabhängigen Prüfschichten sowie die 3 Test-Rhythmen (Ticket, Schichtwechsel, Wochen-Check mit Gemini & Claude)."}];
    let idx = 0;

    function renderNav() {
      const nav = document.getElementById('nav-strip');
      nav.innerHTML = '';
      let lastGrp = '';
      SLIDES.forEach((s, i) => {
        if (s.group !== lastGrp) {
          const lbl = document.createElement('span');
          lbl.className = 'sep';
          lbl.textContent = s.group === 'A' ? 'Die Reise:' : '|  Heute:';
          nav.appendChild(lbl);
          lastGrp = s.group;
        }
        const b = document.createElement('button');
        b.className = 'tab' + (i === idx ? ' active' : '');
        b.textContent = s.short;
        b.onclick = () => show(i);
        nav.appendChild(b);
      });
    }

    function show(newIdx) {
      idx = (newIdx + SLIDES.length) % SLIDES.length;
      const cur = SLIDES[idx];
      document.querySelectorAll('.slide-panel').forEach((p) => {
        p.style.display = p.dataset.panel === cur.id ? 'block' : 'none';
      });
      document.getElementById('counter').textContent = `${idx + 1} / ${SLIDES.length}`;
      document.getElementById('speaker-note').innerHTML = `<strong>Sprecher-Notiz:</strong> ${cur.note}`;
      renderNav();
    }

    document.getElementById('btn-prev').onclick = () => show(idx - 1);
    document.getElementById('btn-next').onclick = () => show(idx + 1);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); show(idx + 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); show(idx - 1); }
    });

    function activeSvgStr() {
      const svg = document.querySelector(`.slide-panel[data-panel="${SLIDES[idx].id}"] svg`);
      const clone = svg.cloneNode(true);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      return new XMLSerializer().serializeToString(clone);
    }

    document.getElementById('btn-svg').onclick = () => {
      const blob = new Blob([activeSvgStr()], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `${SLIDES[idx].id}.svg`; a.click();
      URL.revokeObjectURL(url);
    };

    document.getElementById('btn-png').onclick = () => {
      const img = new Image();
      const blob = new Blob([activeSvgStr()], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      img.onload = () => {
        const c = document.createElement('canvas'); c.width = 2400; c.height = 1350;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#F8FAFC'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob((pb) => {
          const pu = URL.createObjectURL(pb);
          const a = document.createElement('a'); a.href = pu; a.download = `${SLIDES[idx].id}.png`; a.click();
          URL.revokeObjectURL(pu);
        }, 'image/png');
      };
      img.src = url;
    };

    show(0);
  </script>
