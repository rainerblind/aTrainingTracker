  <text x="126" y="395" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="800" fill="#1E3A8A">1. Mensch (Product Owner)</text>
  <text x="126" y="419" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" fill="#64748B">Strategie &amp; letzte Instanz</text>
  <circle cx="82" cy="472" r="5.5" fill="#4338CA"/>
  <text x="100" y="477" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16.5" font-weight="800" fill="#0F172A">Gibt Aufgaben frei</text>
  <text x="100" y="502" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="500" fill="#334155">Wählt aus, was die KI bauen darf.</text>
  <circle cx="82" cy="568" r="5.5" fill="#4338CA"/>
  <text x="100" y="573" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16.5" font-weight="800" fill="#0F172A">Nimmt Ergebnisse ab</text>
  <text x="100" y="598" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="500" fill="#334155">Nur der Mensch schließt Tickets final.</text>
  <circle cx="82" cy="664" r="5.5" fill="#4338CA"/>
  <text x="100" y="669" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16.5" font-weight="800" fill="#0F172A">Testet im echten Leben</text>
  <text x="100" y="694" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="500" fill="#334155">Outdoor- &amp; Hardware-Tests am Smartphone.</text>
  <rect x="562" y="364" width="480" height="400" rx="16" fill="#0F172A" fill-opacity="0.06"/>
  <rect x="560" y="360" width="480" height="400" rx="16" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.8"/>
  <rect x="560" y="360" width="480" height="74" rx="16" fill="#F0FDFA"/>
  <rect x="560" y="418" width="480" height="16" fill="#F0FDFA"/>
  <circle cx="602" cy="397" r="15" fill="none" stroke="#0D9488" stroke-width="2.8"/>
  <polyline points="602,389 602,397 608,401" fill="none" stroke="#0D9488" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="638" y="395" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="800" fill="#115E59">2. Schichtführer (Koordinator)</text>
  <text x="638" y="419" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" fill="#64748B">Taktgeber ohne Eigenbau</text>
  <circle cx="594" cy="472" r="5.5" fill="#0D9488"/>
  <text x="612" y="477" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16.5" font-weight="800" fill="#0F172A">Steuert 3 parallele Spuren</text>
  <text x="612" y="502" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="500" fill="#334155">Verteilt getrennte Themen konfliktfrei.</text>
  <circle cx="594" cy="568" r="5.5" fill="#0D9488"/>
  <text x="612" y="573" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16.5" font-weight="800" fill="#0F172A">Sichert die Übergabe</text>
  <text x="612" y="598" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="500" fill="#334155">Testet, protokolliert &amp; startet Folgeschicht.</text>
  <circle cx="594" cy="664" r="5.5" fill="#0D9488"/>
  <text x="612" y="669" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16.5" font-weight="800" fill="#0F172A">Darf nichts überstimmen</text>
  <text x="612" y="694" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="500" fill="#334155">Qualitäts-Urteile sind unantastbar.</text>
