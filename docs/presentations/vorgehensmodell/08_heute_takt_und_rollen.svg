  <rect x="1072" y="360" width="480" height="400" rx="16" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.8"/>
  <rect x="1072" y="360" width="480" height="74" rx="16" fill="#EFF6FF"/>
