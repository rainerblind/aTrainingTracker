  <text x="680" y="305" text-anchor="middle" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#92400E">15:00 Übergabe</text>
  <circle cx="1104" cy="278" r="8" fill="#D97706" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="1104" y="305" text-anchor="middle" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#92400E">22:00 Übergabe</text>
  <circle cx="1520" cy="278" r="8" fill="#D97706" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="1520" y="305" text-anchor="end" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#92400E">05:00 Übergabe</text>
