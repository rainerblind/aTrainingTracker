  <circle cx="1120" cy="395" r="3" fill="#FFFFFF"/>
  <rect x="1108" y="401" width="12" height="2.6" rx="1.3" fill="#FFFFFF"/>
  <text x="1150" y="395" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="800" fill="#1E40AF">3. KI-Teams (Bauen ⇄ Prüfen)</text>
  <text x="1150" y="419" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" fill="#64748B">Getrennte Rollen &amp; smarte Modelle</text>
  <circle cx="1106" cy="472" r="5.5" fill="#2563EB"/>
  <text x="1124" y="477" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16.5" font-weight="800" fill="#0F172A">Strikte Rollentrennung</text>
  <text x="1124" y="502" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="500" fill="#334155">Niemand prüft seine eigene Arbeit.</text>
  <circle cx="1106" cy="568" r="5.5" fill="#2563EB"/>
  <text x="1124" y="573" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16.5" font-weight="800" fill="#0F172A">Gezielte Modellwahl</text>
  <text x="1124" y="598" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="500" fill="#334155">Schnell für Routine, stark für Komplexes &amp; UI.</text>
  <circle cx="1106" cy="664" r="5.5" fill="#2563EB"/>
  <text x="1124" y="669" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16.5" font-weight="800" fill="#0F172A">Kein Festfahren</text>
  <text x="1124" y="694" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="500" fill="#334155">Bei Unklarheit: Frage an Mensch &amp; weiter!</text>
  <rect x="50" y="790" width="1504" height="78" rx="14" fill="#0F172A" fill-opacity="0.06"/>
  <rect x="48" y="786" width="1504" height="78" rx="14" fill="#F0FDFA" stroke="#0D9488" stroke-width="2.2"/>
  <text x="800" y="832" text-anchor="middle" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="18.5" font-weight="700" fill="#115E59">Kernprinzip beim Schichtwechsel: Jeder neue Schichtführer liest den echten Projektstand — niemals alte Chatverläufe.</text>
