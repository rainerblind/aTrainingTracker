  <text x="148.0" y="40.5" text-anchor="middle" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">HEUTE · ORGANISATION</text>
  <text x="266" y="45" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">Wie der Schichtbetrieb heute tickt: Takt &amp; Rollen</text>
  <text x="48" y="81" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="500" fill="#CBD5E1">Drei feste Schichten rund um die Uhr und eine glasklare Aufgabenteilung zwischen Mensch, Schichtführer und KI-Teams</text>
  <text x="1552" y="44" text-anchor="end" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#94A3B8">Folie 8 / 10</text>
  <text x="1552" y="78" text-anchor="end" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="500" fill="#64748B">aTrainingTracker · Vorgehensmodell</text>

  <rect x="50" y="138" width="1504" height="198" rx="16" fill="#0F172A" fill-opacity="0.06"/>
  <rect x="48" y="134" width="1504" height="198" rx="16" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.8"/>
  <text x="80" y="172" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="20" font-weight="800" fill="#0F172A">Der 24-Stunden-Takt: 3 Schichten, 3 feste Übergaben, 0 Leerlauf</text>
  <rect x="80" y="196" width="596" height="82" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="2.4"/>
  <text x="378.0" y="232" text-anchor="middle" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="800" fill="#115E59">Frühschicht</text>
  <text x="378.0" y="259" text-anchor="middle" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" fill="#334155">05:00 – 15:00 Uhr (10 h)</text>
  <rect x="684" y="196" width="416" height="82" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.4"/>
  <text x="892.0" y="232" text-anchor="middle" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="800" fill="#1E40AF">Spätschicht</text>
  <text x="892.0" y="259" text-anchor="middle" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" fill="#334155">15:00 – 22:00 Uhr (7 h)</text>
  <rect x="1108" y="196" width="412" height="82" rx="12" fill="#EEF2FF" stroke="#4338CA" stroke-width="2.4"/>
  <text x="1314.0" y="232" text-anchor="middle" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="800" fill="#1E3A8A">Nachtschicht</text>
  <text x="1314.0" y="259" text-anchor="middle" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" fill="#334155">22:00 – 05:00 Uhr (7 h)</text>
