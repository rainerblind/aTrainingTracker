<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="540" height="220" style="background-color:#121212;">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #FFFFFF; font-size: 13px; text-anchor: middle; }
    .label { font-size: 11px; fill: #9E9E9E; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#121212"/>
  <text x="270" y="28" class="title">Refined Sharp Turn Icons vs. U-Turn (ATT-3573)</text>
  
  <!-- Sharp Left Card -->
  <g transform="translate(100, 42)">
    <rect x="-65" y="0" width="130" height="135" rx="16" fill="#1E1E1E" stroke="#333333" stroke-width="1.5"/>
    <g transform="translate(-40, 10) scale(3.333)">
      <path fill="#1976D2" d="M18,20h-2V8.5c0,-1.38 -1.12,-2.5 -2.5,-2.5c-0.66,0 -1.3,0.26 -1.77,0.73l-2.5,2.5l1.41,1.41l-4.24,0l0,-4.24l1.41,1.41l2.5,-2.5c0.84,-0.84 1.99,-1.32 3.18,-1.32c2.49,0 4.5,2.01 4.5,4.5V20z" />
    </g>
    <text x="0" y="106" style="font-weight:600; fill:#ECEFF1;">Sharp Left (New)</text>
    <text x="0" y="122" class="label">ic_turn_sharp_left</text>
  </g>

  <!-- Sharp Right Card -->
  <g transform="translate(270, 42)">
    <rect x="-65" y="0" width="130" height="135" rx="16" fill="#1E1E1E" stroke="#333333" stroke-width="1.5"/>
    <g transform="translate(-40, 10) scale(3.333)">
      <path fill="#1976D2" d="M6,20h2V8.5c0,-1.38 1.12,-2.5 2.5,-2.5c0.66,0 1.3,0.26 1.77,0.73l2.5,2.5l-1.41,1.41l4.24,0l0,-4.24l-1.41,1.41l-2.5,-2.5c-0.84,-0.84 -1.99,-1.32 -3.18,-1.32c-2.49,0 -4.5,2.01 -4.5,4.5V20z" />
    </g>
    <text x="0" y="106" style="font-weight:600; fill:#ECEFF1;">Sharp Right (New)</text>
    <text x="0" y="122" class="label">ic_turn_sharp_right</text>
  </g>

  <!-- U-Turn Reference Card -->
  <g transform="translate(440, 42)">
    <rect x="-65" y="0" width="130" height="135" rx="16" fill="#1E1E1E" stroke="#333333" stroke-width="1.5"/>
    <g transform="translate(-40, 10) scale(3.333)">
      <path fill="#64B5F6" d="M6,20h2V9c0,-2.21 1.79,-4 4,-4c2.21,0 4,1.79 4,4v11h2V9c0,-3.31 -2.69,-6 -6,-6c-3.31,0 -6,2.69 -6,6V20z M14,14l4,4l4,-4l-1.41,-1.41L19,14.17V9h-2v5.17l-1.59,-1.58L14,14z" />
    </g>
    <text x="0" y="106" style="font-weight:600; fill:#ECEFF1;">U-Turn (Ref)</text>
    <text x="0" y="122" class="label">ic_turn_u_turn</text>
  </g>

  <!-- Bottom subtitle -->
  <text x="270" y="200" class="label">Grounded at baseline y=20 • 2dp stem • 135° acute arrowhead • No U-turn loop resemblance</text>
</svg>
