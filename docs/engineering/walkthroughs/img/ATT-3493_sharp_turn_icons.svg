      <path fill="#1976D2" d="M6,20h2V9c0,-2.21 1.79,-4 4,-4c2.21,0 4,1.79 4,4v2.59l-1.59,-1.59L13,11.41l4,4l4,-4l-1.41,-1.41L18,11.59V9c0,-3.31 -2.69,-6 -6,-6c-3.31,0 -6,2.69 -6,6V20z" />
    </g>
    <text x="0" y="106" style="font-weight:600; fill:#ECEFF1;">Sharp Right</text>
    <text x="0" y="122" class="label">ic_turn_sharp_right</text>
  </g>

  <!-- U-Turn Reference Card -->
  <g transform="translate(440, 42)">
    <rect x="-65" y="0" width="130" height="135" rx="16" fill="#1E1E1E" stroke="#333333" stroke-width="1.5"/>
    <g transform="translate(-40, 10) scale(3.333)">
      <path fill="#64B5F6" d="M6,20h2V9c0,-2.21 1.79,-4 4,-4c2.21,0 4,1.79 4,4v11h2V9c0,-3.31 -2.69,-6 -6,-6c-3.31,0 -6,2.69 -6,6V20z M14,14l4,4l4,-4l-1.41,-1.41L19,14.17V9h-2v5.17l-1.59,-1.58L14,14z" />
