    </g>
    <text x="0" y="106" style="font-weight:600; fill:#ECEFF1;">Sharp Left</text>
    <text x="0" y="122" class="label">ic_turn_sharp_left</text>
  </g>

  <!-- Sharp Right Card -->
  <g transform="translate(270, 42)">
    <rect x="-65" y="0" width="130" height="135" rx="16" fill="#1E1E1E" stroke="#333333" stroke-width="1.5"/>
