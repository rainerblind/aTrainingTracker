secrets {
    propertiesFileName = "secrets.properties"
    defaultPropertiesFileName = "secrets.defaults.properties"

    // Keystore signing credentials from release.properties must NEVER be in BuildConfig
    ignoreList.add('^keyAlias$')
    ignoreList.add('^keyAliasPassword$')
    ignoreList.add('^keyStore$')
    ignoreList.add('^keyStorePassword$')

    // Decommissioned & unused third-party secrets
    ignoreList.add('^RUNKEEPER.*')
    ignoreList.add('^TRAININGPEAKS.*')
    ignoreList.add('^DROPBOX_APP_SECRET$')
}

def resolveSigningSecret(String envVar, String altEnvVar, String keyringAccount, String extKey) {
    // Tier 1: Process Environment Variables (CI / local override)
    def envVal = System.getenv(envVar) ?: System.getenv(altEnvVar)
    if (envVal && !envVal.trim().isEmpty()) {
        return envVal.trim()
    }

    // Tier 2: OS Keyring via secret-tool (Linux)
    try {
        def proc = ["secret-tool", "lookup", "service", "atrainingtracker", "account", keyringAccount].execute()
        def sout = new StringBuilder()
        def serr = new StringBuilder()
        proc.consumeProcessOutput(sout, serr)
        proc.waitForOrKill(2000)
        def keyringVal = sout.toString().trim()
        if (proc.exitValue() == 0 && !keyringVal.isEmpty()) {
            return keyringVal
        }
    } catch (Exception ignored) {
        // secret-tool not available or lookup failed
    }

    // Tier 3: External user config strictly outside working tree (~/.config/atrainingtracker/release.properties)
    def userHome = System.getProperty("user.home")
    def extConfigFile = new File(userHome, ".config/atrainingtracker/release.properties")
    if (extConfigFile.exists() && extConfigFile.isFile()) {
        def extProps = new Properties()
        extConfigFile.withInputStream { extProps.load(it) }
        def extVal = extProps.getProperty(extKey)
        if (extVal && !extVal.trim().isEmpty()) {
            return extVal.trim()
        }
    }

    return null
}

def props = new Properties()
def releasePropsFile = rootProject.file("release.properties")
if (releasePropsFile.exists()) {
    releasePropsFile.withInputStream { props.load(it) }
}

def storePass = resolveSigningSecret("KEYSTORE_PASSWORD", "RELEASE_KEYSTORE_PASSWORD", "keyStorePassword", "keyStorePassword")
def keyPass = resolveSigningSecret("KEY_ALIAS_PASSWORD", "RELEASE_KEY_PASSWORD", "keyAliasPassword", "keyAliasPassword")
def storeFilePath = props.getProperty("keyStore")
def keyAliasStr = props.getProperty("keyAlias")

if (storeFilePath && keyAliasStr && storePass && keyPass) {
    android.signingConfigs.release.storeFile rootProject.file(storeFilePath)
    android.signingConfigs.release.storePassword storePass
    android.signingConfigs.release.keyAlias keyAliasStr
    android.signingConfigs.release.keyPassword keyPass
} else {
    project.logger.info('INFO: Release signing credentials incomplete or not found (storeFile/keyAlias in release.properties, passwords via env/keyring/~/.config). Disabling release signing.')
    android.buildTypes.release.signingConfig = null
}

afterEvaluate {
    tasks.findByName("assembleRelease")?.configure {
        dependsOn("testDebugUnitTest")
    }

    // Pure-JVM offline simulation replay CLI (REQ-EXP-046.4, ATT-9349; zero production APK impact)
    tasks.register("replayRawTelemetry", JavaExec) {
        group = "verification"
        description = "Replays recorded .phone_raw.csv.gz and/or .polar_raw.csv.gz sidecars deterministically on pure JVM."
        dependsOn(
            "compileDebugKotlin",
            "compileDebugJavaWithJavac",
            "compileDebugUnitTestKotlin",
            "compileDebugUnitTestJavaWithJavac",
            "processDebugJavaRes",
            "processDebugUnitTestJavaRes"
        )
        mainClass.set("com.atrainingtracker.banalservice.replay.OfflineReplayCliKt")

        doFirst {
            // Resolve compiled debug + unit-test classpath strictly at execution time so
            // configuration stays lazy and testDebugUnitTest is never executed.
            classpath = files(tasks.named("testDebugUnitTest", Test).get().classpath.files)
            def cliArgs = []
            if (project.hasProperty("phoneRaw")) { cliArgs.addAll(["--phone", project.property("phoneRaw").toString()]) }
            if (project.hasProperty("polarRaw")) { cliArgs.addAll(["--polar", project.property("polarRaw").toString()]) }
            if (project.hasProperty("polar2Raw")) { cliArgs.addAll(["--polar2", project.property("polar2Raw").toString()]) }
            if (project.hasProperty("csvOut")) { cliArgs.addAll(["--csv", project.property("csvOut").toString()]) }
            if (project.hasProperty("jsonOut")) { cliArgs.addAll(["--json", project.property("jsonOut").toString()]) }
            if (project.hasProperty("truth")) { cliArgs.addAll(["--truth", project.property("truth").toString()]) }
            if (project.hasProperty("gnssProvider")) { cliArgs.addAll(["--gnss-provider", project.property("gnssProvider").toString()]) }
            if (!cliArgs.isEmpty()) {
                args(cliArgs)
            }
        }
    }
}

