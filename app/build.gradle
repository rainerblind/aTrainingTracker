// Cache-friendly debug versionNameSuffix (Interactive-PO / Rule 8.6):
// - Default (unit tests & agent worktrees): keep versionNameSuffix stable ("") so Stage 4, Gate 4,
//   and fresh Stage 6 Cold Reviewer worktrees reuse :app:compileDebugKotlin / :app:compileDebugJavaWithJavac
//   directly FROM-CACHE (~30-60s instead of ~12 min cold recompile).
// - Pass `-PstampGitHash=true` (e.g., Schichtwechsel Pixel 10 deploy) to stamp `-<short-sha>` into `5.0.0-dev-<sha>`.
def stampGitHash = project.findProperty('stampGitHash')?.toString()?.toBoolean() ?: false
def getGitHash = stampGitHash ? providers.exec {
    commandLine('git', 'rev-parse', '--short', 'HEAD')
}.standardOutput.asText.get().strip() : ""

android {
    compileSdkVersion = 37
    buildToolsVersion = '36.0.0'
    namespace = "com.atrainingtracker"

    compileOptions {
        sourceCompatibility = JavaVersion.toVersion("17")
        targetCompatibility = JavaVersion.toVersion("17")
    }

    defaultConfig {
        minSdkVersion 26 // Android 8
        targetSdkVersion 37
        multiDexEnabled = true
        versionName = "5.0.0-dev"
        versionCode = 273
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [MAPS_API_KEY: "AIzaSyPlaceholderMapsApiKeyForBuildTestingOnly00"]
    }

    signingConfigs {
        //noinspection GroovyMissingReturnStatement
        release {
            // storeFile file('/home/rainer/Dropbox/workspace/keystore')
            // keyAlias "aTrainingTrackerReleaseKey"
        }
    }

    buildFeatures {
        buildConfig = true
        compose = true
        viewBinding = true
    }

    buildTypes {
        debug {
            // Separate the debug build
            applicationIdSuffix = ".debug"
            versionNameSuffix = stampGitHash ? "-${getGitHash}" : ""
            debuggable = true
            minifyEnabled false
        }
        release {
            applicationIdSuffix ""
            debuggable = false

            minifyEnabled = true
            shrinkResources = true
            proguardFiles = [getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro']
            signingConfig = signingConfigs.release
        }
    }
    packagingOptions {
        resources {
            pickFirsts += ['META-INF/NOTICE.txt', 'META-INF/NOTICE', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE.txt', 'META-INF/LICENSE']
        }
    }

    bundle {
        density {
            enableSplit = false
        }
    }

    lint {
        baseline = file('lint-baseline.xml')
        abortOnError = true
        checkReleaseBuilds = true
        htmlReport = true
        xmlReport = true
        // Lint suppressions rationale (REQ-BLD-002.2 / TST-BLD-002.3):
        // 1. DuplicatePlatformClasses: Justified due to legacy third-party library classpath overlaps (Apache HTTP/XML).
        // 2. MissingTranslation: Safely suppressed here because TranslationParityTest.kt (TST-STR-018 under REQ-LOC-001)
        //    strictly enforces complete 9-language translation coverage, format specifiers, and plural consistency in testDebugUnitTest.
        // 3. Range: Suppressed due to 36 historical cursor.getColumnIndex() / parameter range warnings in legacy database/calculation routines (REQ-PRO-133.3); targeted for incremental burn-down.
        disable = ['DuplicatePlatformClasses', 'MissingTranslation', 'Range']
        showAll = true
        textReport = true
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxParallelForks = 2
            forkEvery = 80
            minHeapSize = "256m"
            maxHeapSize = "768m"
            jvmArgs "-XX:+TieredCompilation", "-XX:TieredStopAtLevel=1", "-Dfile.encoding=UTF-8"
            testLogging {
                events "failed"
                exceptionFormat "full"
            }
        }
    }
}

detekt {
    toolVersion = "1.23.8"
    config.setFrom(files("${project.rootDir}/config/detekt/detekt.yml"))
    baseline = file("${project.projectDir}/detekt-baseline.xml")
    buildUponDefaultConfig = true
    allRules = false
    autoCorrect = false
}

tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
    reports {
        html.required.set(true)
        xml.required.set(true)
        txt.required.set(false)
        sarif.required.set(false)
    }
}

kover {
    reports {
        filters {
            excludes {
                classes(
                    '*BuildConfig*',
                    '*ComposableSingletons*',
                    '*.R',
                    '*.R$*',
                    '*Manifest*'
                )
            }
        }
        verify {
            rule("Global Coverage Floor") {
                minBound(40)
                bound {
                    coverageUnits = kotlinx.kover.gradle.plugin.dsl.CoverageUnit.BRANCH
                    minValue = 35
                }
            }
            rule("Critical Tracking") {
                filters {
                    includes {
                        packages('com.atrainingtracker.trainingtracker.tracker')
                    }
                }
                minBound(55)
                bound {
                    coverageUnits = kotlinx.kover.gradle.plugin.dsl.CoverageUnit.BRANCH
                    minValue = 45
                }
            }
            rule("Critical Filters") {
                filters {
                    includes {
                        packages('com.atrainingtracker.banalservice.filters')
                    }
                }
                minBound(70)
                bound {
                    coverageUnits = kotlinx.kover.gradle.plugin.dsl.CoverageUnit.BRANCH
                    minValue = 50
                }
            }
            rule("Critical Sensors & Protocols") {
                filters {
                    includes {
                        packages('com.atrainingtracker.banalservice.devices', 'com.atrainingtracker.banalservice.sensor')
                    }
                }
                minBound(60)
                bound {
                    coverageUnits = kotlinx.kover.gradle.plugin.dsl.CoverageUnit.BRANCH
                    minValue = 50
                }
            }
        }
    }
}

configurations.all {
    resolutionStrategy {
        // ATT-1347: Substitute androidx.core:core:1.15.0 with local patched artifact to eliminate
        // NoSuchMethodError in AccessibilityEventCompat$Api34Impl on Android 14 (API 34)
        dependencySubstitution {
            substitute module('androidx.core:core:1.15.0') using module('androidx.core:core:1.15.0-patched')
        }
        // ATT-1037 / ATT-1347: Pin androidx.core to 1.15.0-patched to eliminate NoSuchMethodError on Android 14 (API 34)
        // (Google Issue Tracker: 558456603 / 551348854). Tracked for re-upgrade in ATT-1091.
        force 'androidx.core:core:1.15.0-patched'
        force 'androidx.core:core-ktx:1.15.0'
        // Pin androidx.activity to 1.10.1 which is fully compatible with core:1.15.0
        // (does not require core:1.16.0+ ProtectionLayout or PictureInPictureProvider)
        force 'androidx.activity:activity:1.10.1'
        force 'androidx.activity:activity-ktx:1.10.1'
        force 'androidx.activity:activity-compose:1.10.1'
        // Pin com.google.android.material to 1.13.0 which is fully compatible with core:1.15.0
        // (material:1.14.0 introduces ProtectionLayout in design_bottom_sheet_dialog.xml requiring core:1.16.0+)
        force 'com.google.android.material:material:1.13.0'
    }
}

