plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'kotlin-parcelize'
}

def getGitHash = providers.exec {
    commandLine('git', 'rev-parse', '--short', 'HEAD')
}.standardOutput.asText.get().strip()

android {
    // Travis update separately
    compileSdkVersion = 36
    buildToolsVersion = '36.0.0'
    namespace = "com.atrainingtracker"

    compileOptions {
        sourceCompatibility = JavaVersion.toVersion("17")
        targetCompatibility = JavaVersion.toVersion("17")
    }

    defaultConfig {
        minSdkVersion 26 // Android 8
        targetSdkVersion 36
        multiDexEnabled = true
        versionName = "4.9.21"
        versionCode = 245
    }

    signingConfigs {
        //noinspection GroovyMissingReturnStatement
        release {
            // storeFile file('/home/rainer/Dropbox/workspace/keystore')
            // keyAlias "aTrainingTrackerReleaseKey"
        }
    }

    buildFeatures {
        buildConfig = true
        compose = true
        viewBinding = true
    }

    buildTypes {
        debug {
            // Separate the debug build
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-${getGitHash}"
            debuggable = true
            minifyEnabled false
        }
        release {
            applicationIdSuffix ""
            debuggable = false

            minifyEnabled = false
            proguardFiles = [getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro']
            signingConfig = signingConfigs.release
        }
    }
    packagingOptions {
        resources {
            pickFirsts += ['META-INF/NOTICE.txt', 'META-INF/NOTICE', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE.txt', 'META-INF/LICENSE']
        }
    }

    lint {
        baseline = file('lint-baseline.xml')
        checkReleaseBuilds = true
        // TODO fix Range, some hundred occurrences
        disable = ['DuplicatePlatformClasses', 'MissingTranslation', 'Range']
        showAll = true
        textReport = true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

configurations {
    compile.exclude group: "junit", module: "junit"
}

dependencies {
    implementation 'com.google.android.material:material:1.13.0'
    implementation "com.google.accompanist:accompanist-drawablepainter:0.37.3"

    // --- Legacy & Hardware SDKs ---
    implementation 'org.apache.httpcomponents:fluent-hc:4.5.14'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.apache.httpcomponents:httpclient-cache:4.5.14'
    implementation 'org.apache.httpcomponents:httpcore:4.4.16'
    implementation 'org.apache.httpcomponents:httpmime:4.5.14'
    implementation 'com.getpebble:pebblekit:4.0.1'
    implementation files('../ANT-Android-SDKs/ANT+_Android_SDK/API/antpluginlib_3-9-0.aar')

    // --- AndroidX Core & Lifecycle ---
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation 'androidx.compose.ui:ui:1.11.1'
    implementation 'androidx.compose.runtime:runtime-saveable:1.11.1'
// Version managed by Compose Plugin

    // --- Compose BOM (Ensures all Compose libs work together) ---
    def composeBom = platform('androidx.compose:compose-bom:2026.04.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // --- Google Maps & Firebase ---
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.maps.android:maps-compose:8.3.0'
    implementation 'com.google.maps.android:android-maps-utils:4.3.0'
    implementation platform('com.google.firebase:firebase-bom:34.12.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    // --- Data & Networking ---
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation 'com.dropbox.core:dropbox-core-sdk:7.0.0'
    implementation 'com.dropbox.core:dropbox-android-sdk:7.0.0'

    // GPX import
    implementation 'com.github.ticofab:android-gpx-parser:2.3.1'
}

secrets {
    propertiesFileName = "secrets.properties"
}

def props = new Properties()
if (rootProject.file("release.properties").exists()) {
    props.load(new FileInputStream(rootProject.file("release.properties")))

    android.signingConfigs.release.storeFile rootProject.file(props.keyStore)
    android.signingConfigs.release.storePassword props.keyStorePassword
    android.signingConfigs.release.keyAlias props.keyAlias
    android.signingConfigs.release.keyPassword props.keyAliasPassword
} else {
    project.logger.info('INFO: Set the values storeFile, storePassword, keyAlias, and keyPassword in release.properties to sign the release.')
    android.buildTypes.release.signingConfig = null
}
