name: Android Branch Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Create CI secrets.properties
        run: |
          cat > secrets.properties <<'EOF'
          MAPS_API_KEY=ci-dummy-key
          STRAVA_CLIENT_ID=ci-dummy-id
          STRAVA_CLIENT_SECRET=ci-dummy-secret
          TRAININGPEAKS_CLIENT_ID=ci-dummy-id
          TRAININGPEAKS_CLIENT_SECRET=ci-dummy-secret
          RUNKEEPER_CLIENT_ID=ci-dummy-id
          RUNKEEPER_CLIENT_SECRET=ci-dummy-secret
          DROPBOX_APP_KEY=ci-dummy-key
          EOF

      - name: Create CI google-services.json
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "0",
              "project_id": "atrainingtracker-ci",
              "storage_bucket": "atrainingtracker-ci.appspot.com",
              "firebase_url": "https://atrainingtracker-ci.firebaseio.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.atrainingtracker"
                  }
                },
                "api_key": [
                  {
                    "current_key": "ci-dummy-api-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "status": 1
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:0000000000000001",
                  "android_client_info": {
                    "package_name": "com.atrainingtracker.debug"
                  }
                },
                "api_key": [
                  {
                    "current_key": "ci-dummy-api-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "status": 1
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
